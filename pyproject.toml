[project]
name = "ipo-risk-decoder-backend"
version = "0.1.0"
description = "IPO Prospectus Risk Decoder FastAPI Backend"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "pandas>=2.1.0",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.26.0",
    "requests>=2.31.0",
    "textstat>=0.7.0",
    "scipy>=1.11.0"
]

[tool.vercel]
entrypoint = "api.index:app"
